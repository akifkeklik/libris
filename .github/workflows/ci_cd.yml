#  Libris CI/CD Automation Pipeline
# Purpose: High-speed automated verification for every push or PR.

name: Libris Engineering Excellence

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Dependency Security Audit ────────────────────────────────────────────
  dependency-audit:
    name: Web Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        working-directory: web
        run: npm audit --audit-level=high

  # Python counterpart of the npm audit above. Flask-Cors 4.0.2 carried three published
  # advisories for months because only the web dependencies were audited.
  backend-dependency-audit:
    name: Backend Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit runtime and test dependencies
        run: pip-audit -r backend/requirements-test.txt --progress-spinner off

  # ─── Database / Migration CI ──────────────────────────────────────────────
  database-ci:
    name: Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      
      - name: Apply Migrations
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Applying CI Stubs..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/ci_stubs.sql"
          for sql in $(ls backend/scripts/[0-9][0-9]_*.sql | sort); do
            echo "Applying $sql..."
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$sql"
          done
          echo "Re-applying 14 and 15 to prove they are idempotent..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/scripts/14_drop_learning_paths_and_knowledge_graph.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/scripts/15_reader_catalog_contributions.sql
          echo "Runtime checks for add_catalog_book..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/tests/sql/test_15_add_catalog_book.sql
          echo "Runtime checks for delete_my_account (migration 16)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/tests/sql/test_16_account_deletion.sql
          echo "RLS isolation for notes and review tables (migrations 09, 10, 13)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/tests/sql/test_09_10_13_rls_isolation.sql
          echo "Reminders: candidates, idempotency, unsubscribe, RLS and worker role (migration 17)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/tests/sql/test_17_reminders.sql
          echo "Push subscriptions, push candidates and product events (migration 18)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/tests/sql/test_18_push_and_events.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/scripts/rollbacks/18_push_and_events_rollback.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f backend/scripts/18_push_and_events.sql

      - name: Validate Hardening Scripts (Forward & Rollback)
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Setting up Supabase Roles for Hardening Testing..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF;
            END \$\$;
          "
          echo "Testing production-safe Stage 1/2 hardening migration..."
          # Stage 3 requires supabase_admin/superuser privileges unavailable to the managed postgres role.
          # The production script intentionally applies only the stages the postgres role can safely own.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/01_PROD_revoke_dangerous_privileges_stage1_stage2.sql"

          echo "Testing 02_DRAFT User Profiles Forward Reconcile Migration..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/02_DRAFT_reconcile_user_profiles.sql"

          echo "Testing 02_DRAFT User Profiles Rollback Runtime 10 Scenarios..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_02_user_profiles_rollback_runtime.sql"

          echo "Testing 03_DRAFT Model A Interactions & Trigger Forward Migration..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger.sql"

          echo "Testing 03_DRAFT Model A Runtime Verification (8 Scenarios)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_03_interactions_and_trigger_runtime.sql"

          echo "Testing 03_DRAFT Model A Rollback & Re-Forward..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger_rollback.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger.sql"

          echo "Testing 04_DRAFT Catalog Lifecycle (Baseline -> Forward -> Verify -> DepCheck -> Rollback -> VerifyBaseline -> Forward -> Re-Verify)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_04_vector_rpc_catalog_lifecycle.sql"

          echo "Testing 01c catalog write lockdown (books / book_embeddings) under anon and authenticated..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_01c_catalog_write_lockdown_runtime.sql"

          echo "Running read-only 01c verification against the post-migration state..."
          # Default `bash -e` has no pipefail; without it a psql error would be hidden by tee.
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -At -F '|' -f "backend/scripts/hardening/verify_01c_catalog_write_lockdown.sql" | tee /tmp/verify_01c.txt
          if grep -q '|FAIL$' /tmp/verify_01c.txt; then echo "01c verification has FAIL rows"; exit 1; fi
          grep -q '^OVERALL|.*|PASS$' /tmp/verify_01c.txt || { echo "01c verification produced no OVERALL PASS row"; exit 1; }

      - name: Validate 01c as a non-superuser table owner (Supabase-like)
        env:
          PGPASSWORD: postgrespassword
        run: |
          set -o pipefail
          # In this service container `postgres` is a superuser, so verify_01c check 64
          # ("add_catalog_book owner can insert into books") passes through rolsuper alone.
          # On Supabase the owner is not a superuser. Rebuild the schema in a separate database
          # owned by a NOSUPERUSER NOBYPASSRLS role and run the 01c test + verify as that role,
          # so the definer insert must work through table ownership alone.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE catalog_owner LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'catalog_owner_ci';
          GRANT anon, authenticated, service_role TO catalog_owner;
          CREATE DATABASE libris_01c_owner OWNER catalog_owner;
          SQL
          # pgvector is not a trusted extension; Supabase pre-installs it the same way.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d libris_01c_owner -c "CREATE EXTENSION IF NOT EXISTS vector;"

          export PGPASSWORD=catalog_owner_ci
          OWNER_PSQL="psql -v ON_ERROR_STOP=1 -h localhost -U catalog_owner -d libris_01c_owner"
          $OWNER_PSQL -c "DO \$\$ BEGIN
              IF (SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = current_user) THEN
                RAISE EXCEPTION 'catalog_owner must be NOSUPERUSER NOBYPASSRLS';
              END IF;
            END \$\$;"
          $OWNER_PSQL -f backend/ci_stubs.sql
          for sql in $(ls backend/scripts/[0-9][0-9]_*.sql | sort); do
            echo "Applying $sql as catalog_owner..."
            $OWNER_PSQL -f "$sql"
          done
          $OWNER_PSQL -f backend/tests/sql/test_15_add_catalog_book.sql
          # 01_PROD targets `FOR ROLE postgres` (already applied in production by that role), so it
          # runs as postgres here; only the 01c test and verify below run as catalog_owner.
          PGPASSWORD=postgrespassword psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d libris_01c_owner \
            -f backend/scripts/hardening/01_PROD_revoke_dangerous_privileges_stage1_stage2.sql

          echo "Testing 01c as a non-superuser owner..."
          $OWNER_PSQL -f backend/scripts/hardening/test_01c_catalog_write_lockdown_runtime.sql
          $OWNER_PSQL -At -F '|' -f backend/scripts/hardening/verify_01c_catalog_write_lockdown.sql | tee /tmp/verify_01c_owner.txt
          if grep -q '|FAIL$' /tmp/verify_01c_owner.txt; then echo "01c verification (non-superuser owner) has FAIL rows"; exit 1; fi
          grep -q '^OVERALL|.*|PASS$' /tmp/verify_01c_owner.txt || { echo "01c verification (non-superuser owner) produced no OVERALL PASS row"; exit 1; }

          # Check 64 must hold through ownership here, not through superuser / BYPASSRLS.
          $OWNER_PSQL -c "DO \$\$ BEGIN
              IF NOT EXISTS (
                SELECT 1
                FROM pg_proc p
                JOIN pg_class c ON c.oid = 'public.books'::regclass
                JOIN pg_roles r ON r.oid = p.proowner
                WHERE p.oid = 'public.add_catalog_book(text,text,text,text,text,text,integer,text)'::regprocedure
                  AND p.proowner = c.relowner
                  AND r.rolname = 'catalog_owner'
                  AND NOT r.rolsuper AND NOT r.rolbypassrls
                  AND NOT c.relforcerowsecurity
              ) THEN
                RAISE EXCEPTION 'add_catalog_book and public.books must share the non-superuser, non-BYPASSRLS owner catalog_owner';
              END IF;
            END \$\$;"

  #   Backend CI (Python/Flask) 
  backend-ci:
    name: Backend Lint & Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-test.txt
          pip install ruff

      - name: Static Analysis (Ruff)
        run: |
          ruff check backend/
        continue-on-error: false

      # Offline RAG contracts: source accuracy, out-of-context ISBN rejection, abstention and
      # degraded-mode labelling. LLM, embeddings and vector store are mocked; no secrets needed.
      # Runs first so a grounding regression is reported under its own name. The full suite
      # below runs these files again (a few seconds).
      - name: RAG Grounding & Degraded-Mode Regression
        run: |
          PYTHONPATH=. python -m pytest backend/tests/test_rag*.py -v --tb=short

      - name: Execute Fast Pytest Suite
        run: |
          PYTHONPATH=. python -m pytest backend/tests/ -v --tb=short

  #   Docker Build CI 
  docker-ci:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Build Backend Image
        run: |
          docker build --no-cache -t libris-backend backend/

      - name: Build Web Image
        run: |
          docker build --no-cache -t libris-web web/

  backend-integration-ci:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Apply Migrations and Hardening Schema
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Applying CI Stubs..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/ci_stubs.sql"
          for sql in $(ls backend/scripts/[0-9][0-9]_*.sql | sort); do
            echo "Applying $sql..."
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$sql"
          done
          echo "Setting up Supabase Roles and Hardening Migrations..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF;
            END \$\$;
          "
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/01_PROD_revoke_dangerous_privileges_stage1_stage2.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/02_DRAFT_reconcile_user_profiles.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger.sql"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-test.txt

      - name: Execute Integration Tests
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
          LIBRIS_TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
        run: |
          PYTHONPATH=. python -m pytest backend/tests/ -m "integration" -v --tb=short

  #   Frontend CI (Next.js/Web)
  web-ci:
    name: Web App Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Lint
        run: |
          cd web
          npm run lint

      - name: Test
        run: |
          cd web
          npm test

      - name: Build
        run: |
          cd web
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          LIBRIS_API_KEY: "mock_api_key"
          BACKEND_URL: "http://localhost:5000"

  # Visual QA CI (Headless Chrome Verification)
  visual-qa-ci:
    name: Headless Chrome Visual QA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-ci, web-ci]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies & Build
        run: |
          cd web
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          LIBRIS_API_KEY: "mock_api_key"
          BACKEND_URL: "http://localhost:5000"

      - name: Execute Visual QA Gate
        env:
          CHROME_BIN: "/usr/bin/google-chrome"
        run: |
          python scripts/visual_qa_gate.py --output-dir artifacts/visual_qa

      - name: Upload Visual QA Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-screenshots
          path: artifacts/visual_qa/
          if-no-files-found: ignore


  web-e2e-ci:
    name: Web End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-ci, web-ci]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies and Browsers
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E Tests (desktop + phone)
        run: |
          cd web
          npx playwright test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
